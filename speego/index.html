    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        document.addEventListener('click', function (e) {
            const sidebar = document.getElementById('sidebar');
            const menuBtn = document.querySelector('.header-right .icon-btn:last-child');

            if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
                sidebar.classList.remove('active');
            }
        });

        const carouselTracks = document.querySelectorAll('.carousel-track');
        carouselTracks.forEach(track => {
            let isDown = false;
            let startX;
            let scrollLeft;

            track.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - track.offsetLeft;
                scrollLeft = track.scrollLeft;
                track.style.cursor = 'grabbing';
            });

            track.addEventListener('mouseleave', () => {
                isDown = false;
                track.style.cursor = 'grab';
            });

            track.addEventListener('mouseup', () => {
                isDown = false;
                track.style.cursor = 'grab';
            });

            track.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - track.offsetLeft;
                const walk = (x - startX) * 2;
                track.scrollLeft = scrollLeft - walk;
            });

            track.style.cursor = 'grab';
        });

        // Chat Overlay Logic
        const chatOverlay = document.getElementById('chatOverlay');
        const openChatBtn = document.getElementById('openChatBtn');
        const closeChatBtn = document.getElementById('closeChatBtn');

        openChatBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            chatOverlay.classList.add('active');
        });

        closeChatBtn.addEventListener('click', () => {
            chatOverlay.classList.remove('active');
        });

        window.addEventListener('click', (e) => {
            if (chatOverlay.classList.contains('active') && !chatOverlay.querySelector('.chat-box').contains(e.target) && e.target !== openChatBtn) {
                chatOverlay.classList.remove('active');
            }
        });
    </script>

    <!-- ============================================================ -->
    <!-- ✅ FIXED: PERSONALIZED RECOMMENDATIONS PER USER -->
    <!-- ============================================================ -->
    <script>
        const RECOMMENDED_API = "http://127.0.0.1:5000/recommended_products";
        const SESSION_API = "get_user_data.php";
        const recommendedTrack = document.getElementById("recommended");

        // Store current user info
        let currentUser = null;

        /**
         * ✅ Get logged-in user from PHP session
         */
        async function getCurrentUser() {
            try {
                const response = await fetch(SESSION_API);
                const data = await response.json();

                if (!data.error && data.CustomerID) {
                    currentUser = {
                        customer_id: data.CustomerID,
                        first_name: data.Customer_FName,
                        last_name: data.Customer_LName,
                        full_name: `${data.Customer_FName} ${data.Customer_LName}`
                    };

                    console.log('✅ User logged in:', currentUser.full_name, '(ID:', currentUser.customer_id + ')');

                    // Update greeting in header
                    const nameElement = document.getElementById("userName");
                    if (nameElement) {
                        nameElement.textContent = currentUser.full_name;
                    }

                    return currentUser;
                } else {
                    console.warn('⚠️ No user logged in');
                    const nameElement = document.getElementById("userName");
                    if (nameElement) {
                        nameElement.textContent = "Guest";
                    }
                    return null;
                }
            } catch (error) {
                console.error('❌ Error fetching session:', error);
                return null;
            }
        }

        /**
         * ✅ Load personalized recommendations based on user
         */
        async function loadRecommendedProducts() {
            try {
                // Get current user first
                const user = await getCurrentUser();

                // Build API URL with customer_id
                let apiUrl = RECOMMENDED_API;
                if (user && user.customer_id) {
                    apiUrl += `?customer_id=${user.customer_id}&limit=6`;
                    console.log('🎯 Loading PERSONALIZED recommendations for Customer ID:', user.customer_id);
                } else {
                    apiUrl += `?limit=6`;
                    console.log('📦 Loading generic popular products (no user logged in)');
                }

                // Fetch recommendations
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const products = await response.json();
                console.log(`✅ Loaded ${products.length} recommendations`);
                console.log('📊 Recommendation details:', products);

                // Render to carousel
                renderRecommendedCarousel(products);

            } catch (error) {
                console.error('❌ Failed to load recommendations:', error);
                // Show error placeholder
                recommendedTrack.innerHTML = `
                    <div class="card" style="display: flex; align-items: center; justify-content: center; color: #999; flex-direction: column; padding: 2rem;">
                        <i class="ph ph-warning-circle" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <p>Unable to load recommendations</p>
                    </div>
                `;
            }
        }

        /**
         * ✅ Render recommendations with reasons
         */
        function renderRecommendedCarousel(products) {
            recommendedTrack.innerHTML = ""; // Clear skeleton loaders

            if (!products || products.length === 0) {
                recommendedTrack.innerHTML = `
                    <div class="card" style="display: flex; align-items: center; justify-content: center; color: #999; flex-direction: column; padding: 2rem;">
                        <i class="ph ph-package" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                        <p>No recommendations available</p>
                        <p style="font-size: 0.8rem;">Start shopping to get personalized suggestions!</p>
                    </div>
                `;
                return;
            }

            // Limit to 6 products for carousel
            const limitedProducts = products.slice(0, 6);

            limitedProducts.forEach(p => {
                const card = document.createElement("div");
                card.classList.add("card");
                card.style.cursor = "pointer";

                // Try to load product image, fallback to placeholder
                const imageName = p.Product_Name.replace(/ /g, '%20');
                const reason = p.recommendation_reason || 'Recommended for you';

                card.innerHTML = `
                    <img src="images/${imageName}.png" 
                         alt="${p.Product_Name}"
                         style="width: 100%; height: 150px; object-fit: cover;"
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                    <div style="display: none; height: 150px; background: #f0f0f0; align-items: center; justify-content: center; color: #999;">
                        <i class="ph ph-image" style="font-size: 3rem;"></i>
                    </div>
                    <div class="card-info" style="padding: 1rem; text-align: center;">
                        <p style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem;">${p.Product_Name}</p>
                        <p style="color: #dc2626; font-weight: 700; font-size: 1rem; margin-bottom: 0.5rem;">₱${Number(p.Price).toLocaleString()}</p>
                        ${reason ? `<p style="font-size: 0.7rem; color: #666; font-style: italic; display: flex; align-items: center; justify-content: center; gap: 0.25rem;">
                            <i class="ph ph-sparkle" style="color: #fbbf24;"></i>${reason}
                        </p>` : ''}
                    </div>
                `;

                // Click handler - navigate to product details
                card.addEventListener("click", () => {
                    window.location.href = `productdetails.html?id=${p.ProductID}`;
                });

                recommendedTrack.appendChild(card);
            });
        }

        // ✅ Initialize recommendations when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Initializing personalized recommendations...');
            loadRecommendedProducts();
        });
    </script>

    <!-- ============================================================ -->
    <!-- CHAT FUNCTIONALITY -->
    <!-- ============================================================ -->
    <script>
        const sendBtn = document.getElementById('send-btn');
        const chatInput = document.getElementById('chat-input');
        const chatBody = document.querySelector('.chat-body');

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            const userMsg = document.createElement('p');
            userMsg.classList.add('user-msg');
            userMsg.textContent = message;
            chatBody.appendChild(userMsg);
            chatInput.value = '';
            chatBody.scrollTop = chatBody.scrollHeight;

            const typing = document.createElement('p');
            typing.innerHTML = `<strong>SpeegoPal:</strong> <em>Typing...</em>`;
            chatBody.appendChild(typing);
            chatBody.scrollTop = chatBody.scrollHeight;

            try {
                const response = await fetch('http://127.0.0.1:5000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        customer_id: currentUser ? currentUser.customer_id : null
                    })
                });

                const data = await response.json();
                typing.remove();

                const botMsg = document.createElement('p');
                botMsg.innerHTML = `<strong>SpeegoPal:</strong> ${data.reply}`;
                chatBody.appendChild(botMsg);
                chatBody.scrollTop = chatBody.scrollHeight;

            } catch (error) {
                typing.remove();
                const errMsg = document.createElement('p');
                errMsg.innerHTML = `<strong>SpeegoPal:</strong> Sorry, I couldn't reach the server.`;
                chatBody.appendChild(errMsg);
                chatBody.scrollTop = chatBody.scrollHeight;
            }
        }
    </script>

    <style>
        /* Skeleton loader animation */
        .skeleton {

            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }
