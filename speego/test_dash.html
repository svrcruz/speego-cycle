<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Recommendations - SpeegoCycle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .user-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .user-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
        }

        .user-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .user-card.active {
            border-color: #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }

        .user-card h3 {
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .user-card p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .user-stats {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .stat {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
        }

        .load-btn {
            width: 100%;
            padding: 1rem;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .load-btn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .load-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
        }

        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid #f3f4f6;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .product-card {
            background: #f9fafb;
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .product-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .product-category {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #dc2626;
            margin: 0.5rem 0;
        }

        .recommendation-reason {
            background: #fef3c7;
            color: #92400e;
            padding: 0.5rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .recommendation-reason::before {
            content: "✨";
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box h4 {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .stat-box p {
            font-size: 2rem;
            font-weight: 700;
        }

        .error {
            background: #fee2e2;
            border: 2px solid #dc2626;
            color: #991b1b;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 2rem 0;
        }

        .success {
            background: #d1fae5;
            border: 2px solid #10b981;
            color: #065f46;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 2rem 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎯 Test Personalized Recommendations</h1>

        <div class="controls">
            <h2 style="margin-bottom: 1rem; color: #1f2937;">Select a User to Test</h2>
            <div class="user-selector" id="userSelector">
                <div class="user-card" data-id="1">
                    <h3>👤 Juan Dela Cruz</h3>
                    <p>📧 juan23@example.com</p>
                    <div class="user-stats">
                        <span class="stat">ID: 1</span>
                        <span class="stat">📦 1 Order</span>
                        <span class="stat">🛒 1 in Cart</span>
                    </div>
                </div>

                <div class="user-card" data-id="2">
                    <h3>👤 Aira Fajardo</h3>
                    <p>📧 amc@example.com</p>
                    <div class="user-stats">
                        <span class="stat">ID: 2</span>
                        <span class="stat">📦 2 Orders</span>
                        <span class="stat">🛒 1 in Cart</span>
                    </div>
                </div>

                <div class="user-card" data-id="3">
                    <h3>👤 John Doe</h3>
                    <p>📧 johndoe1@gmail.com</p>
                    <div class="user-stats">
                        <span class="stat">ID: 3</span>
                        <span class="stat">📦 4 Orders</span>
                        <span class="stat">🛒 1 in Cart</span>
                    </div>
                </div>
            </div>

            <button class="load-btn" id="loadBtn" disabled>
                Select a user first
            </button>
        </div>

        <div class="results" id="results" style="display: none;">
            <!-- Results will be loaded here -->
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000/recommended_products";
        let selectedUserId = null;

        // User card selection
        document.querySelectorAll('.user-card').forEach(card => {
            card.addEventListener('click', () => {
                document.querySelectorAll('.user-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                selectedUserId = card.getAttribute('data-id');

                const loadBtn = document.getElementById('loadBtn');
                loadBtn.disabled = false;
                loadBtn.textContent = `Load Recommendations for Customer ${selectedUserId}`;
            });
        });

        // Load recommendations
        document.getElementById('loadBtn').addEventListener('click', async () => {
            if (!selectedUserId) return;

            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 1rem; font-size: 1.1rem;">Loading personalized recommendations for Customer ${selectedUserId}...</p>
                </div>
            `;

            try {
                const response = await fetch(`${API_URL}?customer_id=${selectedUserId}&limit=12`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const products = await response.json();

                if (products.error) {
                    throw new Error(products.error);
                }

                displayResults(products, selectedUserId);

            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="error">
                        <h3 style="margin-bottom: 0.5rem;">❌ Error Loading Recommendations</h3>
                        <p>${error.message}</p>
                        <p style="margin-top: 1rem; font-size: 0.9rem;">Make sure your Flask server is running on http://127.0.0.1:5000</p>
                    </div>
                `;
            }
        });

        function displayResults(products, customerId) {
            const resultsDiv = document.getElementById('results');

            if (!products || products.length === 0) {
                resultsDiv.innerHTML = `
                    <div class="error">
                        <h3>⚠️ No Recommendations Found</h3>
                        <p>Customer ${customerId} has no personalized recommendations yet.</p>
                        <p style="margin-top: 0.5rem;">This user needs to:</p>
                        <ul style="margin-top: 0.5rem; margin-left: 1.5rem;">
                            <li>Add items to cart</li>
                            <li>Make purchases</li>
                            <li>Browse products</li>
                        </ul>
                    </div>
                `;
                return;
            }

            // Count recommendation types
            const reasonCounts = {};
            products.forEach(p => {
                const reason = p.recommendation_reason || 'Unknown';
                reasonCounts[reason] = (reasonCounts[reason] || 0) + 1;
            });

            let statsHTML = '<div class="stats-summary">';
            statsHTML += `<div class="stat-box"><h4>Total Recommendations</h4><p>${products.length}</p></div>`;

            Object.entries(reasonCounts).forEach(([reason, count]) => {
                statsHTML += `<div class="stat-box"><h4>${reason}</h4><p>${count}</p></div>`;
            });
            statsHTML += '</div>';

            statsHTML += `
                <div class="success">
                    <h3 style="margin-bottom: 0.5rem;">✅ Successfully Loaded Personalized Recommendations</h3>
                    <p>Customer ${customerId} has ${products.length} personalized product recommendations</p>
                </div>
            `;

            let productsHTML = '<div class="products-grid">';
            products.forEach(p => {
                productsHTML += `
                    <div class="product-card">
                        <div class="product-name">${p.Product_Name}</div>
                        <span class="product-category">${p.Category}</span>
                        <div class="product-price">₱${Number(p.Price).toLocaleString()}</div>
                        <div style="font-size: 0.85rem; color: #6b7280; margin-top: 0.5rem;">
                            Stock: ${p.Stock_Level || p.Stock} available
                        </div>
                        ${p.recommendation_reason ? `
                            <div class="recommendation-reason">
                                ${p.recommendation_reason}
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            productsHTML += '</div>';

            resultsDiv.innerHTML = statsHTML + productsHTML;
        }
    </script>
</body>

</html>
